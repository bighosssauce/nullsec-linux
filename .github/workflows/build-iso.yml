name: Build NullSec Linux ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies and Patch live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap isolinux syslinux-common
          sudo sed -i 's|dists/\${LB_PARENT_DISTRIBUTION}/Contents-|dists/\${LB_PARENT_DISTRIBUTION}/main/Contents-|g' /usr/lib/live/build/lb_chroot_linux-image

      - name: Build ISO
        run: |
          chmod +x build/build-iso.sh
          sudo ./build/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nullsec-linux-iso
          path: output/*.iso
